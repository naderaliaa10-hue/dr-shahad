workflows:
  dr-shahad-android:
    name: Dr Shahad Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:

      - name: Extract and prepare project
        script: |
          set -euo pipefail

          echo "=== DR SHAHAD: PREPARE PROJECT ==="

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR"

          cd "$PROJECT_DIR"

          cp pubspec.yaml pubspec.yaml.codemagic-backup

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          replacements = {
              "file_picker": "10.3.10",
              "record": "6.2.1",
              "audioplayers": "6.8.1",
              "shared_preferences": "2.5.5",
              "flutter_lints": "5.0.0",
          }

          for name, version in replacements.items():
              pattern = rf"^(\s+{re.escape(name)}:\s*).*$"

              s, count = re.subn(
                  pattern,
                  rf"\g<1>{version}",
                  s,
                  flags=re.MULTILINE
              )

              if count == 0:
                  raise SystemExit(
                      f"ERROR: dependency {name} not found in pubspec.yaml"
                  )

          p.write_text(s)

          print("Compatible dependency versions written.")
          PY

          echo "=== REMOVING OLD ANDROID PROJECT ==="

          rm -rf android

          echo "=== GENERATING MODERN ANDROID PROJECT ==="

          flutter create \
            --platforms=android \
            --project-name=dr_shahad \
            .

          echo "=== VERIFYING MODERN ANDROID PROJECT ==="

          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "=== MODERN ANDROID PROJECT VERIFIED ==="


      - name: Configure Android API 36
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== CONFIGURING ANDROID API 36 ==="

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              s
          )

          s = re.sub(
              r"minSdk\s*=\s*flutter\.minSdkVersion",
              "minSdk = 23",
              s
          )

          s = re.sub(
              r"targetSdk\s*=\s*flutter\.targetSdkVersion",
              "targetSdk = 36",
              s
          )

          p.write_text(s)

          print(
              "Android configured: "
              "compileSdk=36, targetSdk=36, minSdk=23"
          )
          PY

          grep -nE \
            "compileSdk|minSdk|targetSdk|sourceCompatibility|targetCompatibility|jvmTarget" \
            android/app/build.gradle.kts || true


      - name: Resolve dependencies
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== FLUTTER VERSION ==="
          flutter --version

          echo "=== CLEAN ==="
          flutter clean

          rm -f pubspec.lock

          echo "=== PUB GET ==="
          flutter pub get

          echo "=== DEPENDENCY TREE ==="
          flutter pub deps --style=compact


      - name: Fix project test files
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== REMOVING DEFAULT FLUTTER TEST ==="

          rm -f test/widget_test.dart

          echo "Default widget test removed."

          echo "=== VERIFYING TEST DIRECTORY ==="

          if [ -d test ]; then
            find test -maxdepth 2 -type f -print || true
          fi


      - name: Compatibility checks
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== FLUTTER ANALYZE SUGGESTIONS ==="

          flutter analyze --suggestions

          echo "=== DART ANALYSIS ==="

          flutter analyze --no-fatal-infos


      - name: Build release APK
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== BUILD RELEASE APK ==="

          flutter build apk \
            --release \
            --no-tree-shake-icons

          APK="$(
            find build/app/outputs/flutter-apk \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "=== BUILD SUCCESSFUL ==="
          echo "APK=$APK"

          ls -lh "$APK"


    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
