workflows:
  dr-shahad-android:
    name: Dr Shahad Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:

      - name: Prepare project from ZIP
        script: |
          set -euo pipefail

          echo "========================================"
          echo "DR SHAHAD - PREPARING PROJECT"
          echo "========================================"

          ZIP_FILE=""

          for f in ./*.zip; do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -name pubspec.yaml -type f -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml was not found inside the ZIP."
            echo "ZIP contents:"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Project files:"
          ls -la

      - name: Recreate modern Android project
        script: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "RECREATING ANDROID PLATFORM"
          echo "========================================"

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml missing."
            exit 1
          fi

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name=dr_shahad \
            .

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Flutter failed to generate Android project."
            exit 1
          fi

          echo "Modern Android project generated successfully."

      - name: Configure Android SDK
        script: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CONFIGURING ANDROID SDK"
          echo "========================================"

          if [ -f android/app/build.gradle ]; then

            python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              s
          )

          s = re.sub(
              r'compileSdk\s+flutter\.compileSdkVersion',
              'compileSdk 36',
              s
          )

          s = re.sub(
              r'minSdk\s*=\s*flutter\.minSdkVersion',
              'minSdk = 23',
              s
          )

          s = re.sub(
              r'minSdkVersion\s+flutter\.minSdkVersion',
              'minSdkVersion 23',
              s
          )

          s = re.sub(
              r'targetSdk\s*=\s*flutter\.targetSdkVersion',
              'targetSdk = 36',
              s
          )

          s = re.sub(
              r'targetSdkVersion\s+flutter\.targetSdkVersion',
              'targetSdkVersion 36',
              s
          )

          p.write_text(s)
          PY

          elif [ -f android/app/build.gradle.kts ]; then

            python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              s
          )

          s = re.sub(
              r'minSdk\s*=\s*flutter\.minSdkVersion',
              'minSdk = 23',
              s
          )

          s = re.sub(
              r'targetSdk\s*=\s*flutter\.targetSdkVersion',
              'targetSdk = 36',
              s
          )

          p.write_text(s)
          PY

          fi

          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Get dependencies
        script: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

      - name: Analyze Dart code
        script: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANALYZING DART CODE"
          echo "========================================"

          flutter analyze

      - name: Build release APK
        script: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING DR SHAHAD APK"
          echo "========================================"

          flutter build apk --release

          APK="$(find build -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "========================================"
          echo "$APK"

    artifacts:
      - "**/build/**/*.apk"
