workflows:
  dr-shahad-android:
    name: Dr Shahad Android
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable

    scripts:
      - name: Extract ZIP
        script: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

      - name: Build APK
        script: |
          set -e

          cd "$PROJECT_DIR"

          flutter pub get

          flutter build apk --release

    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
