workflows:
  dr-shahad-android:
    name: Dr Shahad Android APK
    max_build_duration: 120

    environment:
      flutter: stable

    scripts:
      - name: Extract project
        script: |
          set -e

          echo "=== EXTRACTING PROJECT ==="

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

      - name: Create modern Android project
        script: |
          set -e

          echo "=== CREATING MODERN ANDROID PROJECT ==="

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          rm -rf android

          flutter create --platforms=android --project-name=dr_shahad .

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android project was not created"
            exit 1
          fi

          echo "Modern Android project created successfully"

      - name: Configure Android SDK
        script: |
          set -e

          echo "=== CONFIGURING ANDROID SDK ==="

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          cd "$PROJECT_DIR"

          if [ -f android/app/build.gradle ]; then
            sed -i.bak \
              -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              -e 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' \
              -e 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' \
              android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i.bak \
              -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' \
              -e 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' \
              -e 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' \
              android/app/build.gradle.kts
          fi

          echo "Android SDK configured"

      - name: Get dependencies
        script: |
          set -e

          echo "=== GETTING DEPENDENCIES ==="

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

      - name: Build APK
        script: |
          set -e

          echo "=== BUILDING DR SHAHAD APK ==="

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          cd "$PROJECT_DIR"

          flutter build apk --release

          APK=$(find build/app/outputs/flutter-apk -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "=== BUILD SUCCESSFUL ==="
          echo "$APK"

    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
