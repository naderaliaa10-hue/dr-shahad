workflows:
  dr-shahad-android:
    name: Dr Shahad - Android APK
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:

      - name: Extract and prepare project
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          echo "========================================"
          echo " DR SHAHAD - PREPARE PROJECT"
          echo "========================================"

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE="$(find "$CM_BUILD_DIR" -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR"

          cd "$PROJECT_DIR"

          cp pubspec.yaml pubspec.yaml.codemagic-backup

          echo "========================================"
          echo " UPDATING DEPENDENCIES"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          replacements = {
              "file_picker": "10.3.10",
              "record": "6.2.1",
              "audioplayers": "6.8.1",
              "shared_preferences": "2.5.5",
              "flutter_lints": "5.0.0",
          }

          for name, version in replacements.items():
              pattern = rf"^(\s+{re.escape(name)}:\s*).*$"

              s, count = re.subn(
                  pattern,
                  rf"\g<1>{version}",
                  s,
                  flags=re.MULTILINE
              )

              if count == 0:
                  raise SystemExit(
                      f"ERROR: dependency '{name}' not found in pubspec.yaml"
                  )

          p.write_text(s)

          print("Dependencies updated successfully.")
          PY

          echo "========================================"
          echo " REMOVING OLD ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          echo "========================================"
          echo " GENERATING MODERN ANDROID PROJECT"
          echo "========================================"

          flutter create \
            --platforms=android \
            --project-name=dr_shahad \
            .

          echo "========================================"
          echo " VERIFYING ANDROID PROJECT"
          echo "========================================"

          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Modern Android project verified successfully."

          echo "========================================"
          echo " PREPARATION COMPLETE"
          echo "========================================"


      - name: Configure Android SDK
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          PROJECT_DIR="$(find "$CM_BUILD_DIR/extracted" -type f -name 'pubspec.yaml' -print -quit | xargs dirname)"

          cd "$PROJECT_DIR"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

          echo "Android SDK configured."


      - name: Get Flutter packages
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          PROJECT_DIR="$(find "$CM_BUILD_DIR/extracted" -type f -name 'pubspec.yaml' -print -quit | xargs dirname)"

          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get


      - name: Flutter analyze
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          PROJECT_DIR="$(find "$CM_BUILD_DIR/extracted" -type f -name 'pubspec.yaml' -print -quit | xargs dirname)"

          cd "$PROJECT_DIR"

          flutter analyze --no-fatal-infos


      - name: Build release APK
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          PROJECT_DIR="$(find "$CM_BUILD_DIR/extracted" -type f -name 'pubspec.yaml' -print -quit | xargs dirname)"

          cd "$PROJECT_DIR"

          echo "========================================"
          echo " BUILDING DR SHAHAD APK"
          echo "========================================"

          flutter build apk \
            --release \
            --no-tree-shake-icons

          echo "========================================"
          echo " APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/app-release.apk


    artifacts:
      - extracted/**/build/app/outputs/flutter-apk/app-release.apk
      - extracted/**/build/app/outputs/**/*.aab
