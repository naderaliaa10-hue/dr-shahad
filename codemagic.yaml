workflows:
  dr-shahad-android:
    name: Dr Shahad Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:

      - name: Extract and prepare project
        script: |
          set -euo pipefail

          echo "=== DR SHAHAD: PREPARE PROJECT ==="

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR"

          cd "$PROJECT_DIR"

          cp pubspec.yaml pubspec.yaml.codemagic-backup

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          replacements = {
              "file_picker": "10.3.10",
              "record": "6.2.1",
              "audioplayers": "6.8.1",
              "shared_preferences": "2.5.5",
              "flutter_lints": "5.0.0",
          }

          for name, version in replacements.items():
              pattern = rf"^(\s+{re.escape(name)}:\s*).*$"

              s, count = re.subn(
                  pattern,
                  rf"\g<1>{version}",
                  s,
                  flags=re.MULTILINE
              )

              if count == 0:
                  raise SystemExit(
                      f"ERROR: dependency {name} not found in pubspec.yaml"
                  )

          p.write_text(s)

          print("Compatible dependency versions written.")
          PY

          echo "=== REMOVING OLD ANDROID PROJECT ==="

          rm -rf android

          echo "=== GENERATING MODERN ANDROID PROJECT ==="

          flutter create \
            --platforms=android \
            --project-name=dr_shahad \
            .

          echo "=== VERIFYING MODERN ANDROID PROJECT ==="

          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "=== MODERN ANDROID PROJECT VERIFIED ==="


      - name: Configure Android API 36
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== CONFIGURING ANDROID API 36 ==="

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              s
          )

          s = re.sub(
              r"minSdk\s*=\s*flutter\.minSdkVersion",
              "minSdk = 23",
              s
          )

          s = re.sub(
              r"targetSdk\s*=\s*flutter\.targetSdkVersion",
              "targetSdk = 36",
              s
          )

          p.write_text(s)

          print(
              "Android configured: "
              "compileSdk=36, targetSdk=36, minSdk=23"
          )
          PY

          grep -nE \
            "compileSdk|minSdk|targetSdk|sourceCompatibility|targetCompatibility|jvmTarget" \
            android/app/build.gradle.kts || true


      - name: Resolve dependencies
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== FLUTTER VERSION ==="
          flutter --version

          echo "=== CLEAN ==="
          flutter clean

          rm -f pubspec.lock

          echo "=== PUB GET ==="
          flutter pub get

          echo "=== DEPENDENCY TREE ==="
          flutter pub deps --style=compact


      - name: Fix generated test
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== REMOVING INVALID DEFAULT TEST ==="

          rm -f test/widget_test.dart

          echo "Default widget test removed."


      - name: Fix unused imports
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== FIXING UNUSED IMPORTS ==="

          python3 - <<'PY'
          from pathlib import Path

          files_and_imports = {
              Path("lib/main.dart"): "import 'dart:typed_data';",
              Path("lib/services/voice_service.dart"):
                  "import 'package:record/record.dart';",
          }

          for path, import_line in files_and_imports.items():
              if not path.exists():
                  continue

              lines = path.read_text().splitlines()

              new_lines = [
                  line for line in lines
                  if line.strip() != import_line
              ]

              path.write_text(
                  "\n".join(new_lines) + "\n"
              )

              print(f"Checked: {path}")

          print("Unused imports removed successfully.")
          PY


      - name: Add Dr Shahad robot eyes
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== CREATING EILIK-STYLE DR SHAHAD ROBOT EYES ==="

          mkdir -p lib/widgets

          cat > lib/widgets/robot_eyes.dart <<'DART'
          import 'dart:math' as math;
          import 'package:flutter/material.dart';

          class RobotEyes extends StatefulWidget {
            const RobotEyes({
              super.key,
              this.size = 100,
            });

            final double size;

            @override
            State<RobotEyes> createState() => _RobotEyesState();
          }

          class _RobotEyesState extends State<RobotEyes>
              with TickerProviderStateMixin {
            late final AnimationController _blink;
            late final AnimationController _look;
            late final AnimationController _glow;

            @override
            void initState() {
              super.initState();

              _blink = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 180),
              );

              _look = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 4),
              )..repeat(reverse: true);

              _glow = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1400),
              )..repeat(reverse: true);

              _blinkLoop();
            }

            Future<void> _blinkLoop() async {
              while (mounted) {
                await Future.delayed(
                  const Duration(milliseconds: 3000),
                );

                if (!mounted) return;

                await _blink.forward();

                if (!mounted) return;

                await _blink.reverse();
              }
            }

            @override
            void dispose() {
              _blink.dispose();
              _look.dispose();
              _glow.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: Listenable.merge([
                  _blink,
                  _look,
                  _glow,
                ]),
                builder: (context, child) {
                  final blink =
                      Curves.easeInOut.transform(_blink.value);

                  final look =
                      math.sin(_look.value * math.pi) *
                      widget.size *
                      0.055;

                  final glow =
                      12.0 + (_glow.value * 12.0);

                  return SizedBox(
                    width: widget.size * 2.05,
                    height: widget.size * 0.95,
                    child: Row(
                      mainAxisAlignment:
                          MainAxisAlignment.center,
                      crossAxisAlignment:
                          CrossAxisAlignment.center,
                      children: [
                        _eye(
                          blink: blink,
                          look: look,
                          glow: glow,
                        ),
                        SizedBox(
                          width: widget.size * 0.14,
                        ),
                        _eye(
                          blink: blink,
                          look: look,
                          glow: glow,
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _eye({
              required double blink,
              required double look,
              required double glow,
            }) {
              final width = widget.size * 0.72;

              final normalHeight =
                  widget.size * 0.72;

              final height = math.max(
                widget.size * 0.055,
                normalHeight *
                    (1.0 - blink * 0.94),
              );

              return Container(
                width: width,
                height: height,
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(
                    widget.size,
                  ),
                  gradient: const RadialGradient(
                    center: Alignment.center,
                    radius: 0.82,
                    colors: [
                      Color(0xFFFFFFFF),
                      Color(0xFFDDFBFF),
                      Color(0xFF8DEFFF),
                      Color(0xFF4DD9FF),
                    ],
                    stops: [
                      0.0,
                      0.34,
                      0.72,
                      1.0,
                    ],
                  ),
                  boxShadow: [
                    BoxShadow(
                      color: const Color(0xFF67E8F9)
                          .withValues(alpha: 0.55),
                      blurRadius: glow,
                      spreadRadius: 1,
                    ),
                  ],
                ),
                child: Stack(
                  clipBehavior: Clip.none,
                  children: [
                    Positioned(
                      left: width * 0.30 + look,
                      top: height * 0.18,
                      child: Container(
                        width: width * 0.26,
                        height: width * 0.26,
                        decoration: const BoxDecoration(
                          color: Colors.white,
                          shape: BoxShape.circle,
                        ),
                      ),
                    ),

                    Positioned(
                      right: width * 0.16 - look,
                      bottom: height * 0.17,
                      child: Container(
                        width: width * 0.10,
                        height: width * 0.10,
                        decoration: BoxDecoration(
                          color: Colors.white
                              .withValues(alpha: 0.92),
                          shape: BoxShape.circle,
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          DART

          echo "EILIK-STYLE ROBOT EYES CREATED."


      - name: Add robot eyes to application
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== CONNECTING ROBOT EYES TO APP ==="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/main.dart")

          if not p.exists():
              raise SystemExit("ERROR: lib/main.dart not found.")

          s = p.read_text()

          import_line = "import 'widgets/robot_eyes.dart';"

          marker = "ROBOT_EYES_OVERLAY_ADDED"

          if "return MaterialApp(" not in s:
              raise SystemExit(
                  "ERROR: MaterialApp constructor was not found."
              )

          if marker not in s:

              if import_line not in s:
                  s = import_line + "\n" + s

              s = s.replace(
                  "return MaterialApp(",
                  """return MaterialApp(
            builder: (context, child) {
              return Stack(
                children: [
                  child ?? const SizedBox.shrink(),

                  const Positioned(
                    top: 42,
                    left: 0,
                    right: 0,
                    child: IgnorePointer(
                      child: Center(
                        child: RobotEyes(size: 82),
                      ),
                    ),
                  ),
                ],
              );
            },

            // ROBOT_EYES_OVERLAY_ADDED
          """,
                  1,
              )

          else:

              if import_line not in s:
                  s = import_line + "\n" + s

          p.write_text(s)

          print("Robot eyes integration completed.")
          PY


      - name: Verify Dart files
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== VERIFYING PROJECT FILES ==="

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/widgets/robot_eyes.dart

          echo "pubspec.yaml: OK"
          echo "lib/main.dart: OK"
          echo "lib/widgets/robot_eyes.dart: OK"

          echo "=== VERIFYING ROBOT EYES IMPORT ==="

          grep -Fq \
            "import 'widgets/robot_eyes.dart';" \
            lib/main.dart

          echo "Robot eyes import: OK"

          echo "=== VERIFYING ROBOT EYES USAGE ==="

          grep -Fq \
            "RobotEyes(size: 82)" \
            lib/main.dart

          echo "Robot eyes usage: OK"

          echo "=== VERIFYING MODERN OPACITY API ==="

          if grep -R "withOpacity" lib/widgets/robot_eyes.dart; then
            echo "ERROR: withOpacity still exists."
            exit 1
          fi

          grep -Fq \
            "withValues(alpha:" \
            lib/widgets/robot_eyes.dart

          echo "Modern opacity API: OK"

          if [ -d lib ]; then
            echo "=== LIB DIRECTORY ==="
            find lib -maxdepth 3 -type f -name '*.dart' -print
          fi


      - name: Compatibility checks
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== FLUTTER ANALYZE SUGGESTIONS ==="

          flutter analyze --suggestions

          echo "=== DART ANALYSIS ==="

          flutter analyze --no-fatal-infos

          echo "=== ANALYSIS PASSED ==="


      - name: Build release APK
        script: |
          set -euo pipefail

          PUBSPEC="$(find extracted -type f -name 'pubspec.yaml' -print -quit)"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          cd "$PROJECT_DIR"

          echo "=== BUILD RELEASE APK ==="

          flutter build apk \
            --release \
            --no-tree-shake-icons

          APK="$(
            find build/app/outputs/flutter-apk \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "=== BUILD SUCCESSFUL ==="
          echo "APK=$APK"

          ls -lh "$APK"


    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
