name: Build Dr Shahad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q Dr_Shahad_Cloud_Build.zip -d extracted

          PROJECT=$(find extracted -name pubspec.yaml -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Create modern Android project
        run: |
          rm -rf dr_shahad
          mkdir dr_shahad

          cp -R "$PROJECT"/. dr_shahad/

          cd dr_shahad

          # Valid Dart package name
          sed -i 's/^name:.*/name: dr_shahad/' pubspec.yaml

          # Remove every old Android configuration
          rm -rf android

          # Create completely new Android v2 project
          flutter create \
            --platforms=android \
            --org com.drshahad \
            .

      - name: Update modern dependencies
        working-directory: dr_shahad
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          s = p.read_text()

          # Replace old record dependency if present
          import re
          s = re.sub(
              r'(?m)^\s*record:\s*[^\n]+',
              '  record: ^7.1.1',
              s
          )

          # Add dependency overrides so old record_android
          # can never be selected.
          if "dependency_overrides:" in s:
              s = re.sub(
                  r'dependency_overrides:.*',
                  'dependency_overrides:\n  record_android: ^2.1.2',
                  s,
                  flags=re.S
              )
          else:
              s += "\n\ndependency_overrides:\n  record_android: ^2.1.2\n"

          p.write_text(s)
          PY

          rm -f pubspec.lock
          flutter clean
          flutter pub get

      - name: Verify dependency versions
        working-directory: dr_shahad
        run: |
          echo "Installed record packages:"
          flutter pub deps | grep -E "record|record_android" || true

      - name: Build modern release APK
        working-directory: dr_shahad
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-shahad-apk
          path: dr_shahad/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
