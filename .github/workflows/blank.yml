name: Dr Shahad - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"

          echo "Flutter project OK."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version

      # ==================================================
      # Remove OLD Android folder
      # ==================================================
      - name: Remove old Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf android

          echo "Old Android folder removed."

      # ==================================================
      # Generate completely NEW Android project
      # ==================================================
      - name: Generate modern Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter create \
            --platforms=android \
            --org=com.drshahad \
            .

          echo "Modern Android project generated."

      # ==================================================
      # Verify generated Android project
      # ==================================================
      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            echo "ERROR: Android folder was not generated."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle wrapper was not generated."
            exit 1
          fi

          if [ ! -f android/settings.gradle.kts ] && \
             [ ! -f android/settings.gradle ]; then
            echo "ERROR: Android settings file was not generated."
            exit 1
          fi

          if [ ! -f android/app/build.gradle.kts ] && \
             [ ! -f android/app/build.gradle ]; then
            echo "ERROR: Android app Gradle file was not generated."
            exit 1
          fi

          echo "Android project verification passed."

          echo
          echo "Android files:"
          find android -maxdepth 3 -type f | sort

      # ==================================================
      # Dependencies
      # ==================================================
      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # ==================================================
      # Analyze
      # ==================================================
      - name: Dart analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          dart analyze lib || true

      # ==================================================
      # Clean
      # ==================================================
      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

      # ==================================================
      # Build
      # ==================================================
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING DR SHAHAD APK"
          echo "========================================"

          flutter build apk --release

      # ==================================================
      # Verify APK
      # ==================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR/build/app/outputs" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk/Dr-Shahad-release.apk"

      # ==================================================
      # Upload APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Shahad-APK
          path: apk/Dr-Shahad-release.apk
          if-no-files-found: error
          retention-days: 30
