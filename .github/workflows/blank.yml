name: Dr Shahad - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. GitHub repository
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # 2. Find ZIP
      # ============================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================
      # 3. Extract ZIP
      # ============================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extracted successfully."

      # ============================================
      # 4. Find Flutter project
      # ============================================
      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -print \
            -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================
      # 5. Validate Flutter files
      # ============================================
      - name: Validate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml missing."
            exit 1
          fi

          if [ ! -f lib/main.dart ]; then
            echo "ERROR: lib/main.dart missing."
            exit 1
          fi

          echo "Flutter project OK."

      # ============================================
      # 6. Java 17
      # ============================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================
      # 7. Flutter stable
      # ============================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================
      # 8. Show versions
      # ============================================
      - name: Show Flutter and Java versions
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version

      # ============================================
      # 9. Remove OLD Android project
      # ============================================
      - name: Remove old Android build files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Removing old Android project..."

          rm -rf android

          echo "Old Android project removed."

      # ============================================
      # 10. Generate NEW Android project
      # ============================================
      - name: Generate modern Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Generating Android project using current Flutter..."

          flutter create \
            --platforms=android \
            --project-name=dr_shahad \
            .

          echo "Modern Android project generated."

      # ============================================
      # 11. Configure Android SDK
      # ============================================
      - name: Configure Android
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle was not generated."
            exit 1
          fi

          echo "Configuring Android SDK..."

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          # Compile SDK
          text = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+flutter\.compileSdkVersion',
              'compileSdk 36',
              text
          )

          # Minimum Android version
          text = re.sub(
              r'minSdk\s*=\s*flutter\.minSdkVersion',
              'minSdk = 23',
              text
          )

          text = re.sub(
              r'minSdkVersion\s+flutter\.minSdkVersion',
              'minSdkVersion 23',
              text
          )

          path.write_text(text)
          PY

          echo "Android configuration completed."

      # ============================================
      # 12. AndroidX
      # ============================================
      - name: Configure AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES="$PROJECT_DIR/android/gradle.properties"

          cat >> "$PROPERTIES" <<'EOF'

          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
          EOF

          echo "AndroidX configured."

      # ============================================
      # 13. Dependencies
      # ============================================
      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # ============================================
      # 14. Check Dart
      # ============================================
      - name: Dart analysis
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          dart analyze lib || true

      # ============================================
      # 15. Clean
      # ============================================
      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

          flutter pub get

      # ============================================
      # 16. Build APK
      # ============================================
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING DR SHAHAD APK"
          echo "======================================"

          flutter build apk --release

      # ============================================
      # 17. Find APK
      # ============================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR/build/app/outputs" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR/build" \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk/Dr-Shahad-release.apk"

      # ============================================
      # 18. Upload APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Shahad-APK
          path: apk/Dr-Shahad-release.apk
          if-no-files-found: error
          retention-days: 30
