name: Dr Shahad - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version

      # ==================================================
      # FORCE COMPILE SDK 36
      # ==================================================

      - name: Configure compileSdk 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Searching Android Gradle files..."

          FILES=""

          if [ -f android/app/build.gradle ]; then
            FILES="$FILES android/app/build.gradle"
          fi

          if [ -f android/app/build.gradle.kts ]; then
            FILES="$FILES android/app/build.gradle.kts"
          fi

          if [ -z "$FILES" ]; then
            echo "ERROR: Android app Gradle file not found."

            find android -maxdepth 3 -type f -print

            exit 1
          fi

          for FILE in $FILES; do

            echo "========================================"
            echo "Updating:"
            echo "$FILE"
            echo "========================================"

            python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          # Flutter compileSdk
          text = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+flutter\.compileSdkVersion',
              'compileSdk 36',
              text
          )

          # Numeric compileSdk
          text = re.sub(
              r'compileSdk\s*=\s*[0-9]+',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'compileSdk\s+[0-9]+',
              'compileSdk 36',
              text
          )

          # compileSdkVersion
          text = re.sub(
              r'compileSdkVersion\s+[0-9]+',
              'compileSdkVersion 36',
              text
          )

          path.write_text(text)
          PY

            echo
            echo "Result:"
            grep -n "compileSdk" "$FILE" || true

          done

      # ==================================================
      # Verify compileSdk
      # ==================================================

      - name: Verify compileSdk 36
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFYING COMPILE SDK"
          echo "========================================"

          grep -Rni \
            "compileSdk" \
            android/app \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

          if grep -Rni \
            "compileSdk.*34" \
            android/app \
            --include="*.gradle" \
            --include="*.gradle.kts"; then

            echo "ERROR: compileSdk 34 is still present."
            exit 1
          fi

          echo "compileSdk 34 is not present in app configuration."

      # ==================================================
      # Dependencies
      # ==================================================

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # ==================================================
      # Clean
      # ==================================================

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean

          flutter pub get

      # ==================================================
      # Build
      # ==================================================

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING DR SHAHAD APK"
          echo "COMPILE SDK: 36"
          echo "========================================"

          flutter build apk --release

      # ==================================================
      # Verify APK
      # ==================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR/build/app/outputs" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk/Dr-Shahad-release.apk"

      # ==================================================
      # Upload APK
      # ==================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Shahad-APK
          path: apk/Dr-Shahad-release.apk
          if-no-files-found: error
          retention-days: 30
