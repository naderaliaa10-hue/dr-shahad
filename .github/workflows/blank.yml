name: Build Dr Shahad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q Dr_Shahad_Cloud_Build.zip -d project
          find project -maxdepth 3 -type f | head -100

      - name: Find Flutter project
        run: |
          PROJECT=$(find project -name pubspec.yaml -type f | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Get dependencies
        working-directory: ${{ env.PROJECT }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-shahad-apk
          path: ${{ env.PROJECT }}/build/app/outputs/flutter-apk/app-release.apk
