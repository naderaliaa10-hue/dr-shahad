name: Dr Shahad - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Dr Shahad APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Find ZIP file
      # --------------------------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for ZIP files..."

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print \
            -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo
            echo "Available files:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -print
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. Extract ZIP
      # --------------------------------------------------
      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo
          echo "Extraction completed."

          echo
          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 4 \
            -type f \
            -print | sort | head -300

      # --------------------------------------------------
      # 4. Find Flutter project
      # --------------------------------------------------
      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name 'pubspec.yaml' \
              -not -path '*/.dart_tool/*' \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found."
            echo
            echo "Searching for all pubspec.yaml files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name 'pubspec.yaml' \
              -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Validate project
      # --------------------------------------------------
      - name: Validate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo
          echo "Project contents:"
          ls -la

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml is missing."
            exit 1
          fi

          if [ ! -d "lib" ]; then
            echo "ERROR: lib directory is missing."
            exit 1
          fi

          if [ ! -f "lib/main.dart" ]; then
            echo "ERROR: lib/main.dart is missing."
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "ERROR: android directory is missing."
            exit 1
          fi

          echo
          echo "Required Flutter files are present."

      # --------------------------------------------------
      # 6. Setup Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 7. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 8. Show versions
      # --------------------------------------------------
      - name: Show Flutter and Dart versions
        shell: bash
        run: |
          flutter --version
          dart --version
          java -version

      # --------------------------------------------------
      # 9. Clean
      # --------------------------------------------------
      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter clean

      # --------------------------------------------------
      # 10. Get dependencies
      # --------------------------------------------------
      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      # --------------------------------------------------
      # 11. Analyze code
      # Warnings do NOT stop the build
      # --------------------------------------------------
      - name: Analyze Dart code
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Running Dart analyzer..."

          dart analyze lib || {
            STATUS=$?

            echo
            echo "Dart analyzer returned status: $STATUS"
            echo "Analyzer messages are displayed above."
            echo "Continuing to APK build..."
          }

      # --------------------------------------------------
      # 12. Build APK
      # --------------------------------------------------
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building release APK..."

          flutter build apk \
            --release

      # --------------------------------------------------
      # 13. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory was not found."
            echo
            echo "Searching for APK files..."
            find "$PROJECT_DIR/build" \
              -type f \
              -name '*.apk' \
              -print || true
            exit 1
          fi

          APK_FILE="$(
            find "$APK_DIR" \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk/Dr-Shahad-release.apk"

      # --------------------------------------------------
      # 14. Upload APK
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Shahad-APK
          path: apk/Dr-Shahad-release.apk
          if-no-files-found: error
          retention-days: 30
