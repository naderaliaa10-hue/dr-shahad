name: Build Dr Shahad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q Dr_Shahad_Cloud_Build.zip -d extracted

          PROJECT=$(find extracted -name pubspec.yaml -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: pubspec.yaml was not found"
            exit 1
          fi

          echo "Original project: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Prepare modern Flutter project
        run: |
          rm -rf dr_shahad
          mkdir -p dr_shahad

          cp -R "$PROJECT"/. dr_shahad/

          cd dr_shahad

          sed -i 's/^name:.*/name: dr_shahad/' pubspec.yaml

          echo "Removing old Android project..."
          rm -rf android

          echo "Creating fresh modern Android project..."
          flutter create --platforms=android .

          echo "Checking Android project..."
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle

      - name: Get dependencies
        working-directory: dr_shahad
        run: |
          flutter pub get

      - name: Build release APK
        working-directory: dr_shahad
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-shahad-apk
          path: dr_shahad/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
