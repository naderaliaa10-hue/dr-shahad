name: Dr Shahad - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Dr Shahad APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            find "$GITHUB_WORKSPACE/extracted" \
              -name "pubspec.yaml" -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android

          echo "Flutter project is valid."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$PROJECT_DIR/android/settings.gradle"
          BUILD="$PROJECT_DIR/android/build.gradle"

          echo "Updating Android Gradle Plugin to 8.11.1"

          if [ -f "$SETTINGS" ]; then
            sed -i -E \
              "s/(com\.android\.application['\"][[:space:]]+version[[:space:]]+['\"])[^'\"]+/\18.11.1/g" \
              "$SETTINGS"

            sed -i -E \
              "s/(com\.android\.library['\"][[:space:]]+version[[:space:]]+['\"])[^'\"]+/\18.11.1/g" \
              "$SETTINGS"
          fi

          if [ -f "$BUILD" ]; then
            sed -i -E \
              "s/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:8.11.1/g" \
              "$BUILD"
          fi

          echo "AGP configuration:"
          grep -R "com.android.application" "$PROJECT_DIR/android" || true
          grep -R "com.android.tools.build:gradle" "$PROJECT_DIR/android" || true

      - name: Force Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Forcing Gradle 8.13"

          sed -i -E \
            's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip#' \
            "$WRAPPER"

          echo
          echo "Final Gradle wrapper:"
          cat "$WRAPPER"

      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew --version

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter clean

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze Dart
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          dart analyze lib || true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING DR SHAHAD APK"
          echo "========================================"

          flutter build apk --release

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/build/app/outputs" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/build" \
              -type f \
              -print || true
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/Dr-Shahad-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Shahad-APK
          path: apk/Dr-Shahad-release.apk
          if-no-files-found: error
          retention-days: 30
