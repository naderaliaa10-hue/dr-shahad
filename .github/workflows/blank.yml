name: Build Dr Shahad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q Dr_Shahad_Cloud_Build.zip -d extracted

          PROJECT=$(find extracted -name pubspec.yaml -type f | head -1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: pubspec.yaml was not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Prepare modern Android project
        run: |
          rm -rf dr_shahad
          mkdir dr_shahad
          cp -R "$PROJECT"/. dr_shahad/

          cd dr_shahad

          sed -i 's/^name:.*/name: dr_shahad/' pubspec.yaml

          rm -rf android

          flutter create --platforms=android .

      - name: Fix record dependency
        working-directory: dr_shahad
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          s = p.read_text()

          lines = s.splitlines()
          out = []

          for line in lines:
              if line.strip().startswith("record:"):
                  out.append("  record: ^6.1.0")
              else:
                  out.append(line)

          p.write_text("\n".join(out) + "\n")
          PY

          echo "Updated record dependency:"
          grep -n "record:" pubspec.yaml || true

      - name: Get dependencies
        working-directory: dr_shahad
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: dr_shahad
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-shahad-apk
          path: dr_shahad/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
