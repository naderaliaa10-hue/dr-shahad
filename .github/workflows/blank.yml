name: Dr Shahad - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using: $ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name pubspec.yaml \
            -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -d "$PROJECT_DIR/android"

          echo "Project validation OK."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Android Gradle files
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          import sys
          from pathlib import Path
          import re

          project = Path(sys.argv[1])
          android = project / "android"

          settings = android / "settings.gradle"
          settings_kts = android / "settings.gradle.kts"

          wrapper = android / "gradle" / "wrapper" / "gradle-wrapper.properties"

          # -----------------------------------------
          # AGP 8.11.1
          # -----------------------------------------

          if settings.exists():
              text = settings.read_text()

              text = re.sub(
                  r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>8.11.1\2',
                  text
              )

              text = re.sub(
                  r'(id\s+["\']com\.android\.library["\']\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>8.11.1\2',
                  text
              )

              settings.write_text(text)

          if settings_kts.exists():
              text = settings_kts.read_text()

              text = re.sub(
                  r'(id\("com\.android\.application"\)\s*version\s*")[^"]+(")',
                  r'\g<1>8.11.1\2',
                  text
              )

              text = re.sub(
                  r'(id\("com\.android\.library"\)\s*version\s*")[^"]+(")',
                  r'\g<1>8.11.1\2',
                  text
              )

              settings_kts.write_text(text)

          # -----------------------------------------
          # Gradle 8.14
          # -----------------------------------------

          wrapper.parent.mkdir(parents=True, exist_ok=True)

          lines = []

          if wrapper.exists():
              lines = wrapper.read_text().splitlines()

          found = False

          for i, line in enumerate(lines):
              if line.startswith("distributionUrl="):
                  lines[i] = (
                      "distributionUrl="
                      "https\\://services.gradle.org/distributions/"
                      "gradle-8.14-bin.zip"
                  )
                  found = True

          if not found:
              lines.append(
                  "distributionUrl="
                  "https\\://services.gradle.org/distributions/"
                  "gradle-8.14-bin.zip"
              )

          wrapper.write_text("\n".join(lines) + "\n")

          print("\n===== FINAL settings.gradle =====")

          if settings.exists():
              print(settings.read_text())

          print("\n===== FINAL gradle-wrapper.properties =====")
          print(wrapper.read_text())
          PY

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "===== Gradle wrapper URL ====="
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

          echo
          echo "===== Gradle version actually used ====="
          ./gradlew --version

      - name: Flutter clean
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter clean

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Dart analysis
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          dart analyze lib || true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "===== BUILDING APK ====="

          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/build/app/outputs" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/Dr-Shahad-release.apk"

          echo "APK CREATED:"
          ls -lh "$GITHUB_WORKSPACE/apk/Dr-Shahad-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Shahad-APK
          path: apk/Dr-Shahad-release.apk
          if-no-files-found: error
          retention-days: 30
